<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#182236"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="letters" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#82acff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="3" y="3" width="250" height="250" rx="53" fill="none" stroke="#4f8cff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- monogram -->
  <text x="128" y="141" font-family="'IBM Plex Mono', 'Courier New', monospace" font-weight="700" font-size="104" letter-spacing="-4" text-anchor="middle" fill="url(#letters)">CB</text>

  <!-- uptime / automation pulse line under the monogram -->
  <path d="M 54 176 L 92 176 L 104 158 L 118 194 L 132 176 L 202 176"
        fill="none" stroke="#00d084" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- live status dot -->
  <circle cx="200" cy="60" r="12" fill="#00d084"/>
  <circle cx="200" cy="60" r="20" fill="none" stroke="#00d084" stroke-width="3" stroke-opacity="0.35"/>
</svg>
